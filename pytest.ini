[pytest]
# Where pytest looks for tests, and make "tests/" importable (so "from pages.x import ..." works)
testpaths = tests
pythonpath = tests

# App under test. Override from the terminal with: pytest --base-url http://host:port
base_url = http://127.0.0.1:8000

# -ra: short summary of skipped/failed tests at the end
# On FAILURE only, keep a trace, screenshot and video in test-results/ (great for debugging)
addopts = -ra --strict-markers --output=test-results --tracing=retain-on-failure --screenshot=only-on-failure --video=retain-on-failure

# Registered markers (--strict-markers fails on typos). Run a group with: pytest -m smoke
markers =
    smoke: quick sanity checks that the core flows work
    auth: login / access-control tests
    medicine: medicine CRUD and dose-status tests