# Runs the Playwright test suite on every push / pull request to main.
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab (manual run)

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # kill the job if it hangs, instead of waiting for hours

    # A real MySQL database that lives only for this job
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: medicare
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # settings.py reads these via os.getenv (no .env file exists on the CI machine)
    env:
      DB_NAME: medicare
      DB_USER: root
      DB_PASSWORD: ""
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          playwright install --with-deps chromium

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u root --silent && break
            sleep 2
          done

      - name: Run Django migrations
        run: python manage.py migrate

      - name: Create test user
        run: |
          python manage.py shell -c "
          from django.contrib.auth.models import User
          if not User.objects.filter(username='testuser').exists():
              User.objects.create_user('testuser', password='testpass123')
          "

      - name: Start Django server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          # Wait until the server really answers (more reliable than a fixed sleep)
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/login/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/login/ > /dev/null   # fail the step here if it never came up

      - name: Run Playwright tests
        run: pytest -v

      # Only when something failed: save traces/screenshots/videos so you can download and debug them
      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            server.log
          if-no-files-found: ignore
